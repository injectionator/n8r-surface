name: Prepare, stage or verify npm release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare draft assets, stage retained bytes for 2FA approval, or verify published bytes
        required: true
        type: choice
        options: [prepare, stage, verify]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'injectionator/n8r-surface' && github.ref == 'refs/tags/v0.1.0-experimental.3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Use the rehearsed npm version with staged publishing
        run: npm install --global npm@11.20.0
      - name: Verify release source
        run: |
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -z "$(git status --porcelain)"
          npm run check:version
      - name: Prepare fresh artifacts (refuse an existing release)
        if: inputs.operation == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # API failures fail closed; a draft or published release blocks rebuilding.
          gh api --paginate --slurp repos/injectionator/n8r-surface/releases > "$RUNNER_TEMP/releases.json"
          node --input-type=module -e 'import fs from "node:fs"; const releases=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/releases.json")); if (releases.flat().some(r=>r.tag_name==="v0.1.0-experimental.3")) throw Error("Release already exists; reuse its retained artifacts")'
          npm ci
          npm cache add yaml@2.9.1
          npm test
          npm run check:package
          npm run pack:candidates -- "$RUNNER_TEMP/candidates" --publishable
          node --input-type=module -e 'import fs from "node:fs"; const d=process.env.RUNNER_TEMP+"/candidates"; const r=JSON.parse(fs.readFileSync(d+"/candidates.json")); for(const p of r.packages) fs.copyFileSync(d+"/"+p.filename,d+"/"+p.releaseAsset)'
      - name: Retain complete build before creating any release
        if: inputs.operation == 'prepare'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/candidates/
          if-no-files-found: error
          retention-days: 90
      - name: Create draft with retained assets
        if: inputs.operation == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-experimental.3 --verify-tag --target "$GITHUB_SHA" --draft --prerelease --title '0.1.0-experimental.3' --notes 'Experimental scoped package release. Publication and independent registry verification are pending.' "$RUNNER_TEMP/candidates/candidates.json" "$RUNNER_TEMP/candidates/"*.tgz
      - name: Download and verify retained release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/retained"
          gh release download v0.1.0-experimental.3 --dir "$RUNNER_TEMP/retained" --pattern candidates.json --pattern '*.tgz'
          node --input-type=module -e 'import fs from "node:fs"; const d=process.env.RUNNER_TEMP+"/retained"; for(const folder of ["scoped"]) { fs.mkdirSync(d+"/"+folder); fs.copyFileSync(d+"/n8r-surface-0.1.0-experimental.3-"+folder+".tgz",d+"/"+folder+"/n8r-surface-0.1.0-experimental.3.tgz") }'
          npm run check:release -- "$RUNNER_TEMP/retained"
      - name: Stage missing versions or verify approved registry bytes
        if: inputs.operation != 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
          # Bootstrap only. Once scoped trusted publishing works, remove this secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          RELEASE_OPERATION: ${{ inputs.operation }}
        run: node scripts/publish-packages.mjs "$RUNNER_TEMP/retained" "$RELEASE_OPERATION"
